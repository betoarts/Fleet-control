name: Build Android APK (Tauri v2 Rust)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-android:
    name: Compilar APK Android via Tauri v2 (Rust)
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://kxfsmifgymckdykompqg.supabase.co' }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imt4ZnNtaWZneW1ja2R5a29tcHFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3ODM0NjMsImV4cCI6MjA5MjM1OTQ2M30.XI72AIMJtWasm09k9XFHGV94l6NEnJMu72Z7gZuSq9I' }}

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências NPM
        run: npm ci || npm install

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Aceitar Licenças e Configurar NDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "build-tools;34.0.0" "platforms;android-34"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: Configurar Rust Toolchain com Alvos Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Cache de Compilação Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Compilar Frontend (React + Vite + Apple Liquid Glass)
        run: npm run build

      - name: Inicializar Projeto Android Tauri v2
        run: |
          npx tauri android init --ci
          node scripts/configure-android-manifest.js

      - name: Gerar Chave Criptográfica de Assinatura (Keystore)
        run: |
          keytool -genkey -v -keystore release.keystore -keyalg RSA -keysize 2048 -validity 10000 \
            -alias fleetcontrol -storepass nbapark123 -keypass nbapark123 \
            -dname "CN=FleetControl, OU=Fleet, O=NBAPARK, L=SaoPaulo, S=SP, C=BR"

          mkdir -p src-tauri/gen/android
          cat <<EOF > src-tauri/gen/android/keystore.properties
          storePassword=nbapark123
          keyPassword=nbapark123
          keyAlias=fleetcontrol
          storeFile=../../release.keystore
          EOF

      - name: Compilar APK Android via Terminal
        run: |
          npx tauri android build --apk --target aarch64 armv7 --ci

      - name: Assinar e Validar APKs com apksigner
        id: sign-apk
        run: |
          mkdir -p release-output
          APKS=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk")
          echo "=== APKs ENCONTRADOS ==="
          echo "$APKS"

          TARGET_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
          if [ -z "$TARGET_APK" ]; then
            TARGET_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          echo "Assinando APK selecionado: $TARGET_APK"

          $ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:nbapark123 \
            --ks-key-alias fleetcontrol \
            --key-pass pass:nbapark123 \
            --out release-output/FleetControl-Tauri-V2.apk \
            "$TARGET_APK"

          echo "Verificando assinatura do APK..."
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify -v release-output/FleetControl-Tauri-V2.apk

          ls -lh release-output

      - name: Publicar APK Assinado como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FleetControl-Tauri-V2-Signed
          path: release-output/FleetControl-Tauri-V2.apk
          if-no-files-found: error
