[package]
name = "fleet-control"
version = "1.0.0"
description = "Fleet Control Tauri App"
authors = ["NBAPARK Frota"]
edition = "2021"

[lib]
name = "fleet_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-geolocation = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
