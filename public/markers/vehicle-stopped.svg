<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 50" width="40" height="50">
  <!-- Shadow -->
  <ellipse cx="20" cy="47" rx="8" ry="3" fill="rgba(0,0,0,0.2)"/>
  
  <!-- Pin shape -->
  <path d="M20 0 C8.954 0 0 8.954 0 20 C0 35 20 50 20 50 C20 50 40 35 40 20 C40 8.954 31.046 0 20 0 Z" 
        fill="#EF4444" stroke="#DC2626" stroke-width="2"/>
  
  <!-- Pulse animation circle -->
  <circle cx="20" cy="20" r="18" fill="none" stroke="#EF4444" stroke-width="2" opacity="0.5">
    <animate attributeName="r" values="16;22;16" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0;0.5" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Car icon -->
  <g transform="translate(8, 8)">
    <path d="M22 10 L20 6 L16 4 L8 4 L4 6 L2 10 L2 16 L4 18 L4 20 L6 20 L6 18 L18 18 L18 20 L20 20 L20 18 L22 16 Z" 
          fill="white" stroke="white" stroke-width="0.5"/>
    <circle cx="6" cy="16" r="2" fill="#DC2626"/>
    <circle cx="18" cy="16" r="2" fill="#DC2626"/>
    <rect x="6" y="8" width="12" height="5" rx="1" fill="#DC2626" opacity="0.5"/>
  </g>
  
  <!-- Stop indicator (pause icon) -->
  <g transform="translate(15, -2)" fill="white">
    <rect x="0" y="0" width="3" height="8" rx="1"/>
    <rect x="5" y="0" width="3" height="8" rx="1"/>
  </g>
</svg>
