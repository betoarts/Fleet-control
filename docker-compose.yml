services:
  postgres:
    image: postgres:17-alpine
    container_name: fleet-control-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: fleet_user
      POSTGRES_PASSWORD: fleet_pass_2026
      POSTGRES_DB: fleet_control
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_user -d fleet_control"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgrest:
    image: postgrest/postgrest:v12.2.0
    container_name: fleet-control-api
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      PGRST_DB_URI: postgres://authenticator:fleet_pgrst_pass_2026@postgres:5432/fleet_control
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: "super-secret-jwt-key-must-be-at-least-32-characters-long"
      PGRST_LOG_LEVEL: debug
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    image: nginx:alpine
    container_name: fleet-control-gateway
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - postgrest

volumes:
  pgdata:
    driver: local
